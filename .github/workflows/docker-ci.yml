name: CI Docker Ferreteria

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen de Docker
        run: docker build -t ferreteria-web:latest .

      - name: Verificar imagen creada
        run: docker images
