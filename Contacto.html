<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Proyecto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Canales de Contacto</h1>
        <p>Comunícate con nuestro equipo para cotizaciones y pedidos.</p>
    </header>
    <main class="container">
        <section class="contacto-info">
            <div class="info-card">
                <h3>Horario de Atención</h3>
                <p>Lunes a Sábado: 9:00 AM - 7:00 PM</p>
            </div>
            <div class="info-card">
                <h3>Ventas y WhatsApp</h3>
                <p>Teléfono: +51 999 888 777</p>
            </div>
        </section>
        <section class="contacto-form">
            <h2>Envíanos un mensaje</h2>
            <form id="formContacto">
                <input type="text" id="nombre" placeholder="Tu Nombre Completo" required>
                <input type="email" id="correo" placeholder="Correo Electrónico" required>
                <textarea id="mensaje" placeholder="¿En qué producto estás interesado?" required></textarea>
                <button type="submit" class="btn">Enviar Consulta</button>
            </form>
            <p id="mensajeConfirmacion" style="display:none; color: green; margin-top: 10px;">¡Gracias! Tu mensaje fue enviado con éxito.</p>
        </section>
    </main>

    <footer>
        <p style="text-align: center; margin: 30px 0;"><a href="index.html">← Volver al Inicio</a> | <a href="Catalogo.html">Ver Catálogo</a></p>
    </footer>

    <script>
        document.getElementById('formContacto').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('mensajeConfirmacion').style.display = 'block';
            this.reset();
        });
    </script>
</body>
</html>
